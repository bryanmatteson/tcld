[package]
    authors.workspace    = true
    default-run          = "tcld"
    edition.workspace    = true
    license.workspace    = true
    name                 = "tcld"
    repository.workspace = true
    version.workspace    = true

[features]
    # The default CLI does not link an embedded Tcl runtime. Batch commands,
    # explore, and host debugging work without hybrid. Enable the TEBC VM with:
    #   cargo build -p tcld --features hybrid
    #   scripts/verify-hybrid-gates.sh
    default           = []
    integration_tclsh = []
    # In-process TEBC VM + embedded Tcl 9 WorldHost (requires Tcl 9 headers/libs).
    # Enables `tcld run` plus hybrid `tcld debug` for raw `.tbc` and admitted Tcl source.
    hybrid = ["dep:tcld-vm", "tcld-vm/host", "tcld-vm/debug", "tcld-tauri?/hybrid"]
    # `tcld ui`: hosts the Tauri desktop app in-process with the frontend
    # embedded at compile time. Build the frontend first, then:
    #   npm run build --prefix apps/tcld-gui
    #   cargo build -p tcld --features native-ui
    # Like `tcld-tauri`'s default debugger, this links Tcl 9.
    native-ui = ["dep:tcld-tauri", "tcld-tauri/custom-protocol"]

[dependencies]
    clap.workspace            = true
    crossterm.workspace       = true
    ratatui.workspace         = true
    serde.workspace           = true
    serde_json.workspace      = true
    sha2.workspace            = true
    tcld-compile.workspace    = true
    tcld-core.workspace       = true
    tcld-debug-wire.workspace = true
    tcld-decompile.workspace  = true
    tcld-explore.workspace    = true
    tcld-syntax.workspace     = true
    tcld-tauri                = { workspace = true, optional = true }
    tcld-tui.workspace        = true
    tcld-vm                   = { workspace = true, optional = true }
    tempfile.workspace        = true
    termosaic.workspace       = true

[dev-dependencies]
    portable-pty.workspace = true
    vt100.workspace        = true
