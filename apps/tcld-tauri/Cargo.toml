[package]
    authors.workspace    = true
    edition.workspace    = true
    license.workspace    = true
    name                 = "tcld-tauri"
    repository.workspace = true
    version.workspace    = true

[features]
    # Serve the frontend embedded from `../tcld-gui/dist` instead of the
    # `devUrl` dev server. `cargo tauri build` sets this; `tcld`'s
    # `native-ui` feature enables it so `tcld ui` needs no dev server.
    custom-protocol = ["tauri/custom-protocol"]
    debugger        = ["dep:tcld-interp", "dep:tcl-sys", "dep:tcld-debug-wire"]
    default  = ["debugger", "tcl9"]
    # Links the in-process TEBC VM. Mirrors `tcld`'s feature of the same name
    # and, like it, requires Tcl 9 headers/libs — `tcld-vm/host` pins tcl-sys
    # to the tcl9 ABI, so this is incompatible with `tcl8_6`.
    hybrid = ["dep:tcld-vm", "tcld-vm/host", "tcld-vm/debug"]
    updater = ["dep:tauri-plugin-updater"]
    tcl8_6 = ["tcld-interp?/tcl8_6", "tcl-sys?/tcl8_6"]
    tcl9   = ["tcld-interp?/tcl9", "tcl-sys?/tcl9"]
    # Enables the wire-backend integration tests that drive a real tclsh
    # nub subprocess (TCLD_TCLSH + a built libtcld_dbg dylib) — same
    # gating pattern as crates/tcld-dbg-ext's `integration_tclsh`.
    integration_tclsh = []

[dependencies]
    serde.workspace               = true
    serde_json.workspace          = true
    tauri.workspace               = true
    tauri-plugin-dialog.workspace = true
    tauri-plugin-log.workspace    = true
    tauri-plugin-updater          = { version = "2", optional = true }
    tcl-sys                       = { workspace = true, optional = true }
    tcld-compile.workspace         = true
    tcld-core.workspace           = true
    tcld-debug-wire               = { workspace = true, optional = true }
    tcld-decompile.workspace      = true
    tcld-interp                   = { workspace = true, optional = true }
    tcld-syntax.workspace         = true
    tcld-vm                       = { workspace = true, optional = true }
    tokio.workspace               = true

[build-dependencies]
    tauri-build.workspace = true
