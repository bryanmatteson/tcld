[package]
name = "tcld-vm"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hybrid TEBC bytecode engine (VM loop + optional embedded Tcl host bridge)"

[features]
default = ["host", "debug"]
# Link/use embedded Tcl via tcld-interp for WorldHost invokes (hybrid mode).
host = ["dep:tcld-interp", "dep:tcl-sys"]
# Model B pause hooks and debug surfaces used by apps/tcld hybrid debug.
debug = []

[dependencies]
tcld-core.workspace = true
tcld-compile.workspace = true
tcld-decompile.workspace = true
thiserror.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
tcl-sys = { workspace = true, features = ["tcl9"], optional = true }
tcld-interp = { workspace = true, features = ["tcl9"], optional = true }

[dev-dependencies]
sha2.workspace = true
static_assertions.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
