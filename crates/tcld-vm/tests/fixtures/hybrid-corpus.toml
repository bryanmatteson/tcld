version = 1

[[synthetic_proof]]
group = "pass_f1_f12"
test = "f1_hand_built_arith_jump, f2_host_puts, f3_local_set_append, f4_proc_tbc, f5_catch1_tbc, f6_break_tbc, f7_cont2_happy_path, f8_public_fixture_registration_count, f9_hostvar_synthetic, f9b_upvar_vm_to_vm, f10_trap_suite, f11_vm_strict_world_host_denied, f12_debug_hybrid_pause_shape"

[[synthetic_proof]]
group = "catch_completion"
test = "catch_captures_return_break_and_continue_codes"

[[synthetic_proof]]
group = "foreach_old_new"
test = "foreach_legacy_assigns_groups_and_fills_missing_values, foreach_new_uses_frame_owned_state_and_cleans_stack"

[[synthetic_proof]]
group = "jump_tables"
test = "jump_tables_consume_keys, foreach_and_jump_tables_reject_invalid_aux_state_and_targets"

[[synthetic_proof]]
group = "dict_core"
test = "dict_lvt_mutations_set_unset_incr_append_and_lappend, dict_expand_recombine_and_iteration_follow_compiled_protocols"

[[synthetic_proof]]
group = "expand"
test = "expanded_invoke_handles_lists_empty_marks_and_parse_errors, nested_expansion_and_invoke_replace_preserve_stack_protocols"

[[synthetic_proof]]
group = "variables"
test = "promoted_integer_string_regexp_syntax_and_variable_edges_match_tcl, host_value_string_and_clock_protocols_match_tcl, host_frame_mirror_round_trips_arrays_new_locals_unsets_and_vm_links, nsupvar_links_namespace_variable_and_is_denied_before_dispatch_in_strict"

[[synthetic_proof]]
group = "namespace"
test = "frame_namespace_resolves_sibling_vm_proc_relative_host_and_ns_current"

[[synthetic_proof]]
group = "semantic_failures"
test = "stable_semantic_failure_oracles_are_exact"

