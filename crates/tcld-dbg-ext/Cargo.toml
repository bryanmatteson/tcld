[package]
    authors.workspace    = true
    edition.workspace    = true
    license.workspace    = true
    name                 = "tcld-dbg-ext"
    repository.workspace = true
    version.workspace    = true

[features]
    default            = ["tcl9"]
    loadable-extension = ["tcl-sys/loadable-extension"]
    tcl8_5             = ["tcl-sys/tcl8_5"]
    tcl8_6             = ["tcl-sys/tcl8_6"]
    tcl9               = ["tcl-sys/tcl9"]
    # Phase 4-D: spawn a real tclsh subprocess in tests. Requires `tclsh`
    # (Tcl 9) on PATH or via TCLD_TCLSH env var, plus the dylib built.
    integration_tclsh = []

[lib]
    crate-type = ["cdylib", "rlib"]
    name       = "tcld_dbg"

[dependencies]
    arc-swap.workspace         = true
    tcl-sys.workspace          = true
    tcld-debug-state.workspace = true
    tcld-debug-wire.workspace  = true
    tcld-syntax.workspace      = true

[build-dependencies]
    cc.workspace = true
