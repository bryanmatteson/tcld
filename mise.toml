[tools]
    rust          = "1.97.1"
    rust-analyzer = "latest"

[tasks."tcld:explore"]
    description = "Open the unified interactive terminal explorer"
    run         = "cargo run --bin tcld -- explore"

[tasks."tcld:build-ui"]
    description = "Build tcld with the embedded native desktop UI (`tcld ui`)"
    run         = [
        "test -d apps/tcld-gui/node_modules || npm ci --prefix apps/tcld-gui",
        "npm run build --prefix apps/tcld-gui",
        "cargo build -p tcld --features native-ui",
    ]

[tasks."tcld:ui"]
    description = "Open the native desktop workbench (`mise run tcld:ui [FILE]`)"
    depends     = [ "tcld:build-ui" ]
    run         = "target/debug/tcld ui"

[tasks."tcld:install"]
    description = "Install the CLI and its manifested Tcl 9 debugger nub"
    run         = "scripts/install-tcld.sh"

[tasks."tcld-tauri:dev"]
    description = "Run the desktop GUI in development mode"
    run         = "cargo tauri dev"

[tasks."tcld:ci"]
    description = "Run local native and OrbStack CI explicitly"
    run = "python3 scripts/distribution/release.py ci"

[tasks."tcld:dist"]
    description = "Build and verify a local distribution (no full CI, signing, or publication)"
    run = "python3 scripts/distribution/release.py build"

[tasks."tcld:release"]
    description = "Run local CI and prepare signed packages from committed source"
    run = "python3 scripts/distribution/release.py release"
